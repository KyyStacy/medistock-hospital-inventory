version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: medistock-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: medistock
      POSTGRES_PASSWORD: medistock_pass
      POSTGRES_DB: medistock
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medistock']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
